<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="bsTitle">
  <title id="bsTitle">BodaSafe app preview</title>
  <rect width="800" height="450" fill="#12291d"/>

  <!-- map background -->
  <g stroke="#1d4a34" stroke-width="2" opacity="0.7">
    <path d="M0 90 H800" /><path d="M0 170 H800" /><path d="M0 250 H800" /><path d="M0 330 H800" />
    <path d="M120 0 V450" /><path d="M280 0 V450" /><path d="M440 0 V450" /><path d="M600 0 V450" /><path d="M720 0 V450" />
  </g>

  <!-- route -->
  <path d="M120 360 C 220 320, 260 260, 340 230 S 480 150, 600 110" fill="none" stroke="#ffb900" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 16"/>

  <!-- start pin -->
  <circle cx="120" cy="360" r="10" fill="#ffffff"/>
  <circle cx="120" cy="360" r="18" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>

  <!-- rider marker -->
  <g transform="translate(600,110)">
    <circle r="26" fill="#255a40"/>
    <circle r="26" fill="none" stroke="#4c8f6a" stroke-width="8" opacity="0.5"/>
    <path d="M-9 6 L0 -10 L9 6 Z" fill="#ffb900"/>
  </g>

  <!-- phone card overlay -->
  <rect x="470" y="250" width="290" height="160" rx="20" fill="#ffffff"/>
  <circle cx="510" cy="290" r="18" fill="#c9e5d6"/>
  <rect x="538" y="280" width="100" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="538" y="298" width="70" height="8" rx="4" fill="#999999"/>

  <rect x="494" y="330" width="242" height="34" rx="17" fill="#ffb900"/>
  <text x="615" y="352" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a422d">Trip in progress</text>

  <g transform="translate(494,376)">
    <circle r="10" fill="#ff5f57"/>
    <text x="24" y="5" font-family="Outfit, Arial, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">SOS</text>
  </g>

  <!-- top bar -->
  <rect x="0" y="0" width="800" height="48" fill="#0c1c14"/>
  <text x="24" y="30" font-family="Outfit, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffb900">BodaSafe</text>
</svg>
